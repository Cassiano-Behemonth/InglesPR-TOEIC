[build]
  # Pasta que o Netlify serve (os arquivos são enviados prontos pelo GitHub Actions)
  publish = "dist"
  # Cancela o build automático no servidor do Netlify para ZERAR o uso de créditos/minutos de build.
  # O GitHub Actions compila os dados com Python e envia a pasta 'dist' pronta via Netlify CLI.
  ignore = "exit 0"

# Cabeçalhos de cache estático para otimizar consumo de transferência de dados (bandwidth)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

