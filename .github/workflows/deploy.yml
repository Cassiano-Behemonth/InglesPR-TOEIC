name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Roda a cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite rodar manualmente na aba Actions do GitHub

# Permissões necessárias para o deploy oficial do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy ativo por vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-auth

      - name: Run data consolidation
        run: |
          python consolidar_dados.py
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Prepare site directory
        run: |
          mkdir dist
          cp mapa_toeic_pr.html dist/index.html
          cp mapa_toeic_pr.html dist/mapa_toeic_pr.html
          cp comparativo_toeic.html dist/comparativo_toeic.html
          cp parana_ibge.json dist/parana_ibge.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
